name: Deploy

# Every push to main (merge of a PR, a revert, a reset + force-push) builds the
# site and publishes it to the VPS as a new release. The site is served from the
# `current` symlink, so the switch is atomic and old releases stay for rollback.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publish release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          KEEP_RELEASES: 5
        run: |
          set -euo pipefail

          # DEPLOY_PATH must be the dedicated directory of THIS site only.
          case "$DEPLOY_PATH" in
            /var/www/html|/var/www/html/*|*finance*|*..*)
              echo "Refusing to deploy: forbidden DEPLOY_PATH"; exit 1 ;;
            /var/www/?*|/srv/?*|/home/?*/?*) ;;
            *) echo "Refusing to deploy: unexpected DEPLOY_PATH"; exit 1 ;;
          esac

          RELEASE="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes"
          TARGET="$SSH_USER@$SSH_HOST"

          # 1. upload the build into its own fresh release directory
          $SSH "$TARGET" "mkdir -p '$DEPLOY_PATH/releases/$RELEASE'"
          rsync -az --chmod=D755,F644 -e "$SSH" dist/ "$TARGET:$DEPLOY_PATH/releases/$RELEASE/"

          # 2. atomically point `current` at it, then prune old releases
          $SSH "$TARGET" "
            set -e
            cd '$DEPLOY_PATH'
            ln -sfn 'releases/$RELEASE' current.tmp
            mv -Tf current.tmp current
            cd releases
            ls -1dt */ | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf --
          "
          echo "Deployed release $RELEASE"
